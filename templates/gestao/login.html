{% extends "base.html" %}

{% block title %}Login - MCI Indicadores{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🎯</div>
            <h3 style="margin: 0;">MCI Indicadores</h3>
            <p style="color: #666; margin-top: 0.5rem; font-size: 0.9rem;">
                Sistema de Gestão de Indicadores MUVA
            </p>
        </div>

        <form method="POST" class="needs-validation" novalidate>
            <div class="mb-4">
                <label for="password" class="form-label">
                    🔐 Password de Acesso
                </label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Digite a password" required autofocus>
                <small class="text-muted d-block mt-2">
                    Acesso restrito à equipa técnica MUVA
                </small>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg" style="margin-bottom: 1rem;">
                ✓ Entrar no Painel
            </button>

            <div style="text-align: center; padding-top: 1rem; border-top: 1px solid #e0e0e0;">
                <p style="color: #999; font-size: 0.85rem; margin: 0;">
                    © 2026 MUVA | <strong>MCI Indicadores</strong><br>
                    Gestão de Indicadores de Impacto
                </p>
            </div>
        </form>
    </div>
</div>

<style>
    body {
        margin: 0;
        padding: 0;
    }

    main {
        padding: 0 !important;
        min-height: 100vh !important;
    }

    .navbar {
        display: none;
    }
</style>
{% endblock %}
